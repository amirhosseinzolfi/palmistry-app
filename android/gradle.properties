# Global settings for the project
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# --- BUILD OPTIMIZATIONS ---
# Keep the Gradle daemon alive
org.gradle.daemon=true
# Allow parallel compilation of modules
org.gradle.parallel=true
# Enable task output caching
org.gradle.caching=true
# Configure on demand for faster builds
org.gradle.configureondemand=true

# --- FIX FOR "DIFFERENT ROOTS" ERROR ---
# Disables incremental compilation which fails when project is on D: and cache on C:
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false

# --- MEMORY SETTINGS ---
# Optimized heap size and garbage collection
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
