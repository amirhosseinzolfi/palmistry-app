<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background:#070A13; font-family:'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;" xml:space="preserve">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#12182D"/>
      <stop offset="100%" stop-color="#070A13"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowIndigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Starry Background Elements -->
  <g opacity="0.3">
    <circle cx="80" cy="120" r="1" fill="#FFF"/>
    <circle cx="420" cy="180" r="1.5" fill="#00F2FE"/>
    <circle cx="150" cy="50" r="1" fill="#FFF"/>
    <circle cx="380" cy="80" r="2" fill="#9D4EDD"/>
    <circle cx="100" cy="480" r="1.5" fill="#FFF"/>
    <circle cx="450" cy="420" r="1" fill="#00F2FE"/>
    <circle cx="320" cy="540" r="2.5" fill="#9D4EDD" opacity="0.5"/>
  </g>

  <!-- Stylized Cosmic Circles -->
  <circle cx="250" cy="320" r="220" fill="none" stroke="#6366F1" stroke-width="0.5" stroke-dasharray="5,15" opacity="0.3"/>
  <circle cx="250" cy="320" r="160" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-dasharray="10,10" opacity="0.2"/>

  <!-- HAND CONTAINER -->
  <g transform="translate(10, 20)">
    
    <!-- Mounts Glow (Drawn underneath Hand Outline) -->
    <circle cx="180" cy="235" r="28" fill="#9D4EDD" fill-opacity="0.12" filter="url(#glowPurple)"/>
    <circle cx="228" cy="235" r="26" fill="#9D4EDD" fill-opacity="0.12" filter="url(#glowPurple)"/>
    <circle cx="277" cy="235" r="28" fill="#9D4EDD" fill-opacity="0.12" filter="url(#glowPurple)"/>
    <circle cx="337" cy="250" r="26" fill="#9D4EDD" fill-opacity="0.12" filter="url(#glowPurple)"/>
    <circle cx="170" cy="395" r="45" fill="#9D4EDD" fill-opacity="0.15" filter="url(#glowPurple)"/>
    <circle cx="345" cy="410" r="42" fill="#9D4EDD" fill-opacity="0.15" filter="url(#glowPurple)"/>

    <!-- Hand Outline (Glowing Cyan/Teal Vector) -->
    <path d="M 200,506
             C 146,506 106,462 106,407
             C 106,363 66,330 46,286
             C 26,242 66,220 100,247
             C 126,269 146,280 160,242
             C 160,198 140,132 146,93
             C 149,71 183,71 186,93
             C 193,132 193,198 197,225
             C 197,198 202,99 207,60
             C 210,38 242,38 245,60
             C 250,99 250,198 255,225
             C 255,198 260,110 266,82
             C 269,60 300,60 303,82
             C 308,110 308,203 314,231
             C 314,203 319,148 326,121
             C 328,99 356,99 359,121
             C 363,148 363,220 370,253
             C 392,291 406,352 406,407
             C 406,462 366,506 320,506 
             Z" 
          fill="#11152C" fill-opacity="0.6" stroke="#00F2FE" stroke-width="2.5" filter="url(#glowCyan)"/>

    <!-- RINGS (Finger bases) -->
    <path d="M 160,225 C 170,215 185,215 195,225" fill="none" stroke="#FFB703" stroke-width="1.8" opacity="0.8"/>
    <path d="M 210,223 C 223,212 238,212 245,223" fill="none" stroke="#FFB703" stroke-width="1.8" opacity="0.8"/>
    <path d="M 265,223 C 278,212 293,212 300,223" fill="none" stroke="#FFB703" stroke-width="1.8" opacity="0.8"/>
    <path d="M 320,238 C 333,230 348,230 355,242" fill="none" stroke="#FFB703" stroke-width="1.8" opacity="0.8"/>

    <!-- MAJOR LINES (Neon Cyan Glowing Paths) -->
    <path d="M 370,253 C 320,209 253,198 186,198" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 160,253 C 213,247 293,264 366,313" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 160,253 C 193,308 173,423 233,495" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" filter="url(#glowCyan)"/>
    <path d="M 266,500 C 260,418 246,324 237,236" fill="none" stroke="#00F2FE" stroke-width="3.5" stroke-linecap="round" filter="url(#glowCyan)"/>

    <!-- MINOR LINES (Indigo Glowing Paths) -->
    <path d="M 277,247 L 277,352" fill="none" stroke="#6366F1" stroke-width="2.2" stroke-linecap="round" filter="url(#glowIndigo)"/>
    <path d="M 273,462 C 300,401 326,335 340,264" fill="none" stroke="#6366F1" stroke-width="2.2" stroke-linecap="round" filter="url(#glowIndigo)"/>
    <path d="M 360,225 L 380,225" fill="none" stroke="#6366F1" stroke-width="2.2" stroke-linecap="round" filter="url(#glowIndigo)"/>
    <path d="M 170,275 C 180,313 176,379 197,434" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" filter="url(#glowIndigo)"/>
    <path d="M 210,503 C 253,509 293,509 317,503" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" filter="url(#glowIndigo)"/>
    <path d="M 207,510 C 253,516 293,516 320,510" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" filter="url(#glowIndigo)"/>

    <!-- SPECIAL SYMBOLS (Gold Marks) -->
    <!-- Mystic Cross -->
    <g stroke="#FFB703" stroke-width="2" stroke-linecap="round">
      <line x1="253" y1="330" x2="266" y2="341"/>
      <line x1="266" y1="330" x2="253" y2="341"/>
    </g>
    <!-- Star on Mount Jupiter -->
    <g stroke="#FFB703" stroke-width="1.8" stroke-linecap="round">
      <line x1="172" y1="220" x2="182" y2="230"/>
      <line x1="182" y1="220" x2="172" y2="230"/>
      <line x1="177" y1="217" x2="177" y2="233"/>
      <line x1="169" y1="225" x2="185" y2="225"/>
    </g>
    <!-- Square (Mount Venus) -->
    <rect x="170" y="375" width="12" height="12" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Triangle (Mount Apollo) -->
    <polygon points="273,250 281,261 265,261" fill="none" stroke="#FFB703" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Island on Head Line -->
    <ellipse cx="253" cy="264" rx="6" ry="3" fill="none" stroke="#FFB703" stroke-width="1.5"/>

    <!-- LABELS & TEXT -->
    <!-- Mount Labels -->
    <g fill="#A9B2C3" font-size="11" text-anchor="middle" font-weight="bold">
      <text x="175" y="240">تپه مشتری</text>
      <text x="223" y="240">تپه زحل</text>
      <text x="273" y="240">تپه خورشید</text>
      <text x="333" y="255">تپه عطارد</text>
      <text x="166" y="401" fill="#E2E8F0">تپه ونوس</text>
      <text x="346" y="416" fill="#E2E8F0">تپه ماه</text>
      <text x="180" y="305" font-size="9">مریخ پایین</text>
      <text x="360" y="319" font-size="9">مریخ بالا</text>
      <text x="260" y="335" font-size="10">دشت مریخ</text>
    </g>

    <!-- Line Labels -->
    <g fill="#00F2FE" font-size="10" font-weight="bold" filter="url(#glowCyan)">
      <text x="306" y="185">خط قلب</text>
      <text x="293" y="295">خط سر</text>
      <text x="126" y="340">خط زندگی</text>
      <text x="226" y="455">خط سرنوشت</text>
    </g>

    <!-- Minor Line Labels -->
    <g fill="#818CF8" font-size="9" font-weight="bold">
      <text x="290" y="360" text-anchor="start">خط خورشید</text>
      <text x="319" y="380" text-anchor="start">خط سلامت</text>
      <text x="133" y="450" text-anchor="start">خط مریخ</text>
      <text x="350" y="210" text-anchor="end">خط ازدواج</text>
    </g>

    <!-- Special Marks Labels -->
    <g fill="#FBBF24" font-size="8" font-weight="bold" text-anchor="middle">
      <text x="177" y="205">ستاره</text>
      <text x="260" y="318">صلیب عرفانی</text>
      <text x="176" y="395">مربع</text>
      <text x="273" y="235">مثلث</text>
      <text x="253" y="275">جزیره</text>
    </g>

    <!-- Fingers Labels -->
    <g fill="#6C7A9C" font-size="10" text-anchor="middle">
      <text x="86" y="235">شست</text>
      <text x="166" y="45">اشاره</text>
      <text x="226" y="20">میانی</text>
      <text x="286" y="40">حلقه</text>
      <text x="339" y="85">کوچک</text>
    </g>
  </g>
</svg>
