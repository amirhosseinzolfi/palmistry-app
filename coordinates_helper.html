<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmistry Coordinates Helper (Point, Circle, Oval & Path)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .canvas-area {
            flex: 0 0 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .canvas-wrapper {
            position: relative;
            width: 360px;
            height: 500px;
            border: 2px solid #6366f1;
            border-radius: 16px;
            overflow: hidden;
            background: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        .canvas-wrapper img {
            width: 360px;
            height: 500px;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
        }
        .canvas-wrapper svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 360px;
            height: 500px;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
        }
        h2, h3 { margin-top: 0; color: #818cf8; }
        .mode-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #6366f1;
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(99,102,241,0.5);
        }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        textarea {
            width: 100%;
            height: 150px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            direction: ltr;
            resize: vertical;
        }
        .action-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }
        .action-btn:hover { background: #059669; }
        .danger-btn { background: #ef4444; }
        .danger-btn:hover { background: #dc2626; }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }
        .slider-group label { min-width: 150px; font-size: 14px; }
        .slider-group input[type="range"] { flex: 1; }
        .slider-group span { min-width: 45px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="canvas-area">
        <div class="canvas-wrapper" id="wrapper">
            <img src="assets/images/hand.png" alt="Hand asset" id="handImage" />
            <svg id="svgOverlay" viewBox="0 0 360 500">
                <g id="drawnShapes"></g>
                <circle id="hoverPoint" cx="-10" cy="-10" r="4" fill="#f43f5e" />
            </svg>
        </div>
        <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">مختصات موس: <span id="coordsDisplay" style="font-family: monospace; color: #38bdf8;">(0, 0)</span></p>
    </div>

    <div class="controls">
        <div class="panel">
            <h2>حالت‌های انتخاب (Selecting Modes)</h2>
            <div class="btn-group">
                <button class="mode-btn active" onclick="setMode('point')">نقطه منفرد (Single Point)</button>
                <button class="mode-btn" onclick="setMode('circle')">کوه دایره‌ای (Circle Mount)</button>
                <button class="mode-btn" onclick="setMode('oval')">کوه بیضی شکل (Oval Mount)</button>
                <button class="mode-btn" onclick="setMode('path')">مسیر خطوط (Line Path)</button>
            </div>

            <!-- Circle Controls -->
            <div id="circleControls" style="display: none;">
                <div class="slider-group">
                    <label>شعاع دایره (Radius):</label>
                    <input type="range" id="circleRadius" min="5" max="80" value="20" oninput="updateCircleShape()">
                    <span id="radiusVal">20</span>
                </div>
            </div>

            <!-- Oval Controls -->
            <div id="ovalControls" style="display: none;">
                <div class="slider-group">
                    <label>شعاع افقی (Radius X / Width/2):</label>
                    <input type="range" id="ovalRx" min="5" max="100" value="25" oninput="updateOvalShape()">
                    <span id="ovalRxVal">25</span>
                </div>
                <div class="slider-group">
                    <label>شعاع عمودی (Radius Y / Height/2):</label>
                    <input type="range" id="ovalRy" min="5" max="100" value="35" oninput="updateOvalShape()">
                    <span id="ovalRyVal">35</span>
                </div>
                <div class="slider-group">
                    <label>زاویه چرخش (Rotation Angle °):</label>
                    <input type="range" id="ovalRotation" min="-90" max="90" value="0" oninput="updateOvalShape()">
                    <span id="ovalRotVal">0°</span>
                </div>
            </div>

            <div style="margin-top: 12px;">
                <button class="action-btn danger-btn" onclick="clearAll()">پاکسازی کدهای ثبت‌شده (Clear All)</button>
            </div>
        </div>

        <div class="panel">
            <h3>خروجی کد برای فلاتر (Flutter Dart Code Output)</h3>
            <textarea id="dartOutput" readonly placeholder="کد خروجی برای فلاتر اینجا ظاهر می‌شود..."></textarea>
            <button class="action-btn" onclick="copyDartCode()">کپی کد فلاتر (Copy Code)</button>
        </div>
    </div>

    <script>
        let currentMode = 'point';
        let points = [];
        let circleCenter = null;
        let ovalCenter = null;

        const wrapper = document.getElementById('wrapper');
        const svgOverlay = document.getElementById('svgOverlay');
        const drawnShapes = document.getElementById('drawnShapes');
        const hoverPoint = document.getElementById('hoverPoint');
        const coordsDisplay = document.getElementById('coordsDisplay');
        const dartOutput = document.getElementById('dartOutput');

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('circleControls').style.display = (mode === 'circle') ? 'block' : 'none';
            document.getElementById('ovalControls').style.display = (mode === 'oval') ? 'block' : 'none';
        }

        function getCanvasCoords(e) {
            const rect = wrapper.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            return {
                x: Math.max(0, Math.min(360, x)),
                y: Math.max(0, Math.min(500, y))
            };
        }

        wrapper.addEventListener('mousemove', (e) => {
            const { x, y } = getCanvasCoords(e);
            hoverPoint.setAttribute('cx', x);
            hoverPoint.setAttribute('cy', y);
            coordsDisplay.innerText = `(${x}, ${y})`;
        });

        wrapper.addEventListener('click', (e) => {
            const { x, y } = getCanvasCoords(e);

            if (currentMode === 'point') {
                const code = `Offset(${x}, ${y}),`;
                appendCode(code);
                addSvgDot(x, y, '#38bdf8');
            } else if (currentMode === 'path') {
                points.push({ x, y });
                renderPath();
            } else if (currentMode === 'circle') {
                circleCenter = { x, y };
                updateCircleShape();
            } else if (currentMode === 'oval') {
                ovalCenter = { x, y };
                updateOvalShape();
            }
        });

        function updateCircleShape() {
            const r = parseInt(document.getElementById('circleRadius').value);
            document.getElementById('radiusVal').innerText = r;
            if (!circleCenter) return;

            const { x, y } = circleCenter;
            const code = `// Circle Mount\ncenter: Offset(${x}, ${y}), radius: ${r},\nRect.fromCircle(center: const Offset(${x}, ${y}), radius: ${r}),`;
            
            drawnShapes.innerHTML = `<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(99,102,241,0.2)" stroke="#818cf8" stroke-width="2" />
            <circle cx="${x}" cy="${y}" r="3" fill="#818cf8" />`;

            dartOutput.value = code;
        }

        function updateOvalShape() {
            const rx = parseInt(document.getElementById('ovalRx').value);
            const ry = parseInt(document.getElementById('ovalRy').value);
            const rot = parseInt(document.getElementById('ovalRotation').value);

            document.getElementById('ovalRxVal').innerText = rx;
            document.getElementById('ovalRyVal').innerText = ry;
            document.getElementById('ovalRotVal').innerText = rot + '°';

            if (!ovalCenter) return;

            const { x, y } = ovalCenter;
            const width = rx * 2;
            const height = ry * 2;

            let code = `// Oval Mount (Center + Width & Height)\ncenter: Offset(${x}, ${y}), radiusX: ${rx}, radiusY: ${ry}, rotation: ${rot},\nRect.fromCenter(center: const Offset(${x}, ${y}), width: ${width}, height: ${height}),`;

            drawnShapes.innerHTML = `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot}, ${x}, ${y})" fill="rgba(244,63,94,0.25)" stroke="#f43f5e" stroke-width="2" />
            <circle cx="${x}" cy="${y}" r="3" fill="#f43f5e" />`;

            dartOutput.value = code;
        }

        function renderPath() {
            let svg = '';
            let code = '[\n';
            points.forEach((p, i) => {
                code += `  Offset(${p.x}, ${p.y}),\n`;
                svg += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#10b981" />`;
                if (i > 0) {
                    const prev = points[i - 1];
                    svg += `<line x1="${prev.x}" y1="${prev.y}" x2="${p.x}" y2="${p.y}" stroke="#10b981" stroke-width="2" />`;
                }
            });
            code += ']';

            drawnShapes.innerHTML = svg;
            dartOutput.value = code;
        }

        function addSvgDot(x, y, color) {
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', x);
            dot.setAttribute('cy', y);
            dot.setAttribute('r', '4');
            dot.setAttribute('fill', color);
            drawnShapes.appendChild(dot);
        }

        function appendCode(text) {
            dartOutput.value += text + '\n';
        }

        function clearAll() {
            points = [];
            circleCenter = null;
            ovalCenter = null;
            drawnShapes.innerHTML = '';
            dartOutput.value = '';
        }

        function copyDartCode() {
            dartOutput.select();
            document.execCommand('copy');
            alert('کد فلاتر در حافظه کپی شد!');
        }
    </script>
</body>
</html>
