name: palmistry_app
description: "راهنمای جامع کفبینی تعاملی - A premium interactive Palmistry Cheat Sheet app in Persian."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hand.png
    - pkg_database/schema/
    - pkg_database/knowledge/
    - pkg_database/relationships/
    - pkg_database/translations/
    - pkg_database/metadata/
